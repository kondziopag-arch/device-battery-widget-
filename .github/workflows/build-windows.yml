
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install hidapi pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name DeviceBattery battery_widget.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeviceBattery
          path: dist/DeviceBattery.exe
